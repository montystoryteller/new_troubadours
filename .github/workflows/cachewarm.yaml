name: Purge and Force Render URLs

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  purge-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SECRET: ${{ secrets.CLODFLARE_SECRET }}

    steps:
      - name: Purge cache and force render URLs
        shell: bash
        run: |
          urls=(
            "https://newtroubadours.org/"
            "https://newtroubadours.org/index.html"
            "https://newtroubadours.org/event_guide.html"
            "https://newtroubadours.org/tour_guide.html"
            "https://newtroubadours.org/storyclub.html"
            "https://newtroubadours.org/performers.html"
            "https://newtroubadours.org/venues.html"
            "https://newtroubadours.org/festival.html"
            "https://newtroubadours.org/flyers.html"
            "https://newtroubadours.org/media.html"
            "https://newtroubadours.org/stats.html"
          )

          while [ ${#urls[@]} -gt 0 ]; do
            echo ""
            echo "URLs still waiting: ${#urls[@]}"

            remaining=()

            for url in "${urls[@]}"; do
              echo ""
              echo "Processing: $url"

              # 1. Purge cache
              purge_status=$(curl \
                -s \
                -o /dev/null \
                -w "%{http_code}" \
                -H "x-purge-cache: ${SECRET}" \
                --max-time 10 \
                "$url" || true)

              echo "  Purge -> HTTP $purge_status"

              # 2. Force render
              # Capture the response headers so we can check
              # x-prerendered: true from the Cloudflare Worker.
              render_headers=$(mktemp)

              render_status=$(curl \
                -s \
                -D "$render_headers" \
                -o /dev/null \
                -w "%{http_code}" \
                -H "x-force-render: ${SECRET}" \
                --max-time 60 \
                "$url" || true)

              prerendered=$(grep -i '^x-prerendered:' "$render_headers" \
                | tail -n 1 \
                | tr -d '\r' \
                | awk '{print $2}')

              rm -f "$render_headers"

              echo "  Render -> HTTP $render_status"
              echo "  X-Prerendered -> $prerendered"

              # Only consider the URL successful if BOTH conditions
              # are satisfied.
              if [ "$render_status" = "200" ] && [ "$prerendered" = "true" ]; then
                echo "  ✅ Successfully prerendered: $url"
              else
                echo "  ❌ Not successfully prerendered: $url"
                remaining+=("$url")
              fi

              sleep 20
            done

            urls=("${remaining[@]}")
          done

          echo ""
          echo "🎉 All URLs successfully rendered!"
name: Prewarm prerender cache

on:
  schedule:
    - cron: "11 1 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-render everything, ignoring freshness (old snapshots are kept if a render fails)"
        type: boolean
        default: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SECRET: ${{ secrets.CLOUDFLARE_SECRET }}
      SITE: https://newtroubadours.org
      # Max browser renders per run. The free plan allows only 10 browser-minutes
      # per day in total, so keep this modest (raise it on the paid plan). Anything left over
      # is still stale tomorrow and gets picked up then.
      MAX_RENDERS: "40"
      # Skip pages whose snapshot is younger than this (seconds).
      # Base pages (no ?args) are re-rendered about every other day; the many
      # ?arg pages on a slower cycle. Tune ARG_REFRESH_AFTER to your budget:
      # roughly  cycle_days = number_of_pages / MAX_RENDERS.
      BASE_REFRESH_AFTER: "79200"   # 22h
      ARG_REFRESH_AFTER: "432000"    # 5 days
      # Seconds to wait between browser renders. 15 on the free plan; 1-2 on
      # Workers Paid (limits are far higher there).
      RENDER_GAP: "15"
      FULL_REFRESH: ${{ inputs.full_refresh }}

    steps:
      - uses: actions/checkout@v4

      # Rebuild the valid-key index the gatekeeper uses to skip renders for
      # pages that don't exist (e.g. storyclub.html?club=nonexistent).
      # Uses no browser time (one KV write). A failure here never blocks the
      # prewarm: the previous index simply stays in place.
      - name: Sync valid-key index
        continue-on-error: true
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "❌ CLOUDFLARE_SECRET is not configured."
            exit 1
          fi

          index=""
          for name in events_normalized events_normalised; do
            index=$(curl -sf --max-time 30 "$SITE/$name.json" | jq -c '
            # same definitions as ./updatecache (JQ_TOUR_DEFS): generated T-/R- ids; events = sitemap list, last 30 days onward
            def pad: tostring | if length < 2 then "0" + . else . end;
            def ymd: (if type == "array" then .[0] else . end) | select(type == "string") | split("/") | select(length == 3) | map(tonumber? // empty) | select(length == 3) | "\(.[2])\(.[1] | pad)\(.[0] | pad)";
            def vid: ((.venue_id // "") | if . == "" then "unknown-venue" else . end);
            def tourevents:
              ((.tours // {}) | to_entries[] | .key as $k | (.value.tour_dates // [])[]
                 | ((.eventId? | select(type == "string" and . != "")) // ((.date | ymd) as $d | "T-\($k)-\($d)-\(vid)"))),
              ((.repertoire_shows // {}) | to_entries[] | .key as $k | (.value.show_dates // [])[]
                 | ((.eventId? | select(type == "string" and . != "")) // ((.date | ymd) as $d | "R-\($k)-\($d)-\(vid)")));
            def allevents: (.. | objects | .eventId? | strings | select(. != "")), tourevents;
            # yyyymmdd inside an id (T-/R-/structured ids), or from a legacy <name>-<epoch ms> id; empty if none
            def evdate: (capture("(^|-)(?<d>20[0-9]{2}(0[1-9]|1[0-2])(0[1-9]|[12][0-9]|3[01]))(-|$)").d) // (capture("-(?<ms>[0-9]{12,14})$").ms | tonumber / 1000 | floor | strftime("%Y%m%d"));
            {
              performers: (.performers | keys),
              venues: (.venues | keys),
              promoters: (.promoters | keys),
              festivals: (.festivals | keys),
              # "R-" = repertoire shows (tour_guide.html?tour=R-<show>); same as updatecache --sync-keys
              tours: ((.tours | keys) + ((.repertoire_shows // {}) | keys | map("R-" + .))),
              events: ([allevents] | unique | map(select((evdate // "99999999") >= (now - 2592000 | strftime("%Y%m%d"))))),
              clubs: ([.clubs[].club?] + [.. | objects | .club? | strings]
                      | map(select(. != "" and . != "other")) | unique)
            }' 2>/dev/null) && [ -n "$index" ] && break
            index=""
          done

          if [ -z "$index" ]; then
            echo "Could not build the key index; leaving the old one in place."
            exit 1
          fi

          curl -s --max-time 30 -w "  [HTTP %{http_code}]\n" -X POST \
            -H "x-sync-keys: ${SECRET}" --data "$index" "$SITE/"

      - name: Build URL list and prewarm
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "❌ CLOUDFLARE_SECRET is not configured."
            exit 1
          fi

          # 1. Collect URLs: sitemap + optional prewarm-urls.txt (one URL per line)
          all=$(mktemp)
          curl -s --max-time 30 "$SITE/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's/<loc>//' -e 's/<\/loc>//' -e 's/&amp;/\&/g' >> "$all" || true

          if [ -f prewarm-urls.txt ]; then
            grep -v '^\s*$' prewarm-urls.txt | grep -v '^#' >> "$all" || true
          fi

          # Base pages (no args) go FIRST so they get the daily render budget
          # before any ?arg pages. Their prerendered HTML links to the arg pages.
          base=$(mktemp)
          for p in "" index.html event_guide.html tour_guide.html storyclub.html \
                   performers.html venues.html festival.html flyers.html media.html \
                   promoters.html books_merch.html stats.html; do
            echo "$SITE/$p" >> "$base"
          done

          # Base pages first, then everything else in a ROTATING order: the sorted list is
          # started from a different offset each day (UTC day number x pages-per-day), so
          # every page gets a render slot at least once every ~N/(MAX_RENDERS - base pages)
          # days, instead of a random tail of pages going many weeks unrefreshed. Pages that
          # are already fresh (e.g. refreshed by a bot) are skipped without using a render,
          # so the run just carries on further down the list. The offset advances by fewer
          # than the renders actually available (base pages use some of the budget), so
          # consecutive days overlap rather than leave gaps.
          nbase=$(grep -c . "$base")
          step=$(( MAX_RENDERS - nbase )); [ "$step" -ge 1 ] || step=1
          sorted=$(mktemp)
          sort -u "$all" > "$sorted"
          n=$(grep -c . "$sorted" || true)
          off=0
          if [ "${n:-0}" -gt 0 ]; then
            off=$(( ( $(date -u +%s) / 86400 * step ) % n ))
          fi
          rotated=$(mktemp)
          awk -v o="$off" '{ a[NR] = $0 } END { for (i = 1; i <= NR; i++) print a[(i + o - 1) % NR + 1] }' "$sorted" > "$rotated"
          echo "Rotation: $n pages, starting at offset $off (step $step per day)"
          mapfile -t urls < <(cat "$base" "$rotated" | awk '!seen[$0]++')
          echo "Total URLs: ${#urls[@]}"

          full="${FULL_REFRESH:-false}"
          renders=0
          rl=0
          failed=()
          unhealthy=()

          for url in "${urls[@]}"; do
            if [ "$renders" -ge "$MAX_RENDERS" ]; then
              echo "Reached MAX_RENDERS ($MAX_RENDERS); remaining pages will be handled next run."
              break
            fi

            if [ "$full" = "true" ]; then
              extra=()
            else
              if [[ "$url" == *\?* ]]; then after="$ARG_REFRESH_AFTER"; else after="$BASE_REFRESH_AFTER"; fi
              extra=(-H "x-only-if-older-than: ${after}")
            fi

            hdrs=$(mktemp)
            status=$(curl -s -D "$hdrs" -o /dev/null -w "%{http_code}" \
              -H "x-force-render: ${SECRET}" "${extra[@]}" \
              --max-time 90 "$url" || true)

            prerendered=$(grep -i '^x-prerendered:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            skipped=$(grep -i '^x-prerender-skipped:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            quota=$(grep -i '^x-quota-exhausted:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            # Page health as seen in the prerendered snapshot (gatekeeper header; empty on an
            # older gatekeeper). LOG ONLY for now: an unhealthy render is reported, not failed.
            health=$(grep -i '^x-page-health:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            hreason=$(grep -i '^x-page-health-reason:' "$hdrs" | tail -n 1 | tr -d '\r' | cut -d' ' -f2- || true)
            rm -f "$hdrs"

            if [ "$quota" = "true" ]; then
              echo "🛑 Daily Browser Run quota exhausted. Stopping; resumes after 00:00 UTC."
              exit 0
            fi

            if [ "$skipped" = "true" ]; then
              echo "⏭️  fresh, skipped: $url"
              continue                      # no browser used, no need to wait
            fi

            renders=$((renders + 1))

            # The quota message text isn't reliable, so also stop after
            # several consecutive 429s instead of sleeping through them all.
            if [ "$status" = "429" ]; then
              rl=$((rl + 1))
              if [ "$rl" -ge 5 ]; then
                echo "🛑 5 consecutive 429s: Browser Run is limited or out of quota. Stopping; the next run retries."
                exit 0
              fi
            else
              rl=0
            fi
            if [ "$status" = "200" ] && [ "$prerendered" = "true" ]; then
              case "$health" in
                ""|ok|n/a) echo "✅ rendered ($renders): $url" ;;
                *)
                  echo "⚠️  rendered ($renders) but page health is '$health': $url${hreason:+  --  $hreason}"
                  echo "::warning::page health '$health': $url${hreason:+ -- $hreason}"
                  unhealthy+=("$url [$health]") ;;
              esac
            else
              echo "❌ failed (HTTP $status): $url"
              failed+=("$url")
            fi

            sleep "$RENDER_GAP"
          done

          echo ""
          echo "Rendered this run: $renders, failed: ${#failed[@]}, rendered-but-unhealthy: ${#unhealthy[@]}"
          if [ ${#unhealthy[@]} -gt 0 ]; then
            echo "Unhealthy renders (see ./updatecache --health for the reasons):"
            printf '  %s\n' "${unhealthy[@]}"
          fi
          if [ ${#failed[@]} -gt 0 ]; then
            printf '  %s\n' "${failed[@]}"
            # Failed pages stay stale, so tomorrow's run retries them.
            # Only fail the job if everything failed (likely a real outage).
            [ "$renders" -gt "${#failed[@]}" ] || exit 1
          fi

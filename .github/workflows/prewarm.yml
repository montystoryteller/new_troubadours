name: Prewarm prerender cache

on:
  schedule:
    - cron: "11 0 * * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Re-render everything, ignoring freshness (old snapshots are kept if a render fails)"
        type: boolean
        default: false

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SECRET: ${{ secrets.CLOUDFLARE_SECRET }}
      SITE: https://newtroubadours.org
      # Max browser renders per run. The free plan allows only 10 browser-minutes
      # per day in total, so keep this modest (raise it on the paid plan). Anything left over
      # is still stale tomorrow and gets picked up then.
      MAX_RENDERS: "40"
      # Skip pages whose snapshot is younger than this (seconds).
      # Base pages (no ?args) are re-rendered about every other day; the many
      # ?arg pages on a slower cycle. Tune ARG_REFRESH_AFTER to your budget:
      # roughly  cycle_days = number_of_pages / MAX_RENDERS.
      BASE_REFRESH_AFTER: "158400"   # 44h
      ARG_REFRESH_AFTER: "432000"    # 5 days
      # Seconds to wait between browser renders. 15 on the free plan; 1-2 on
      # Workers Paid (limits are far higher there).
      RENDER_GAP: "15"
      FULL_REFRESH: ${{ inputs.full_refresh }}

    steps:
      - uses: actions/checkout@v4

      - name: Build URL list and prewarm
        shell: bash
        run: |
          if [ -z "$SECRET" ]; then
            echo "❌ CLOUDFLARE_SECRET is not configured."
            exit 1
          fi

          # 1. Collect URLs: sitemap + optional prewarm-urls.txt (one URL per line)
          all=$(mktemp)
          curl -s --max-time 30 "$SITE/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's/<loc>//' -e 's/<\/loc>//' -e 's/&amp;/\&/g' >> "$all" || true

          if [ -f prewarm-urls.txt ]; then
            grep -v '^\s*$' prewarm-urls.txt | grep -v '^#' >> "$all" || true
          fi

          # Base pages (no args) go FIRST so they get the daily render budget
          # before any ?arg pages. Their prerendered HTML links to the arg pages.
          base=$(mktemp)
          for p in "" index.html event_guide.html tour_guide.html storyclub.html \
                   performers.html venues.html festival.html flyers.html media.html \
                   promoters.html books_merch.html stats.html; do
            echo "$SITE/$p" >> "$base"
          done

          # Base pages first, then everything else in RANDOM order. Skipped-because-fresh
          # pages don't count toward MAX_RENDERS, so shuffling means every page gets
          # its turn over the following days instead of the same first N always
          # winning and the rest starving.
          mapfile -t urls < <(cat "$base" <(shuf "$all") | awk '!seen[$0]++')
          echo "Total URLs: ${#urls[@]}"

          full="${FULL_REFRESH:-false}"
          renders=0
          rl=0
          failed=()

          for url in "${urls[@]}"; do
            if [ "$renders" -ge "$MAX_RENDERS" ]; then
              echo "Reached MAX_RENDERS ($MAX_RENDERS); remaining pages will be handled next run."
              break
            fi

            if [ "$full" = "true" ]; then
              extra=()
            else
              if [[ "$url" == *\?* ]]; then after="$ARG_REFRESH_AFTER"; else after="$BASE_REFRESH_AFTER"; fi
              extra=(-H "x-only-if-older-than: ${after}")
            fi

            hdrs=$(mktemp)
            status=$(curl -s -D "$hdrs" -o /dev/null -w "%{http_code}" \
              -H "x-force-render: ${SECRET}" "${extra[@]}" \
              --max-time 90 "$url" || true)

            prerendered=$(grep -i '^x-prerendered:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            skipped=$(grep -i '^x-prerender-skipped:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            quota=$(grep -i '^x-quota-exhausted:' "$hdrs" | tail -n 1 | tr -d '\r' | awk '{print $2}' || true)
            rm -f "$hdrs"

            if [ "$quota" = "true" ]; then
              echo "🛑 Daily Browser Run quota exhausted. Stopping; resumes after 00:00 UTC."
              exit 0
            fi

            if [ "$skipped" = "true" ]; then
              echo "⏭️  fresh, skipped: $url"
              continue                      # no browser used, no need to wait
            fi

            renders=$((renders + 1))

            # The quota message text isn't reliable, so also stop after
            # several consecutive 429s instead of sleeping through them all.
            if [ "$status" = "429" ]; then
              rl=$((rl + 1))
              if [ "$rl" -ge 5 ]; then
                echo "🛑 5 consecutive 429s: Browser Run is limited or out of quota. Stopping; the next run retries."
                exit 0
              fi
            else
              rl=0
            fi
            if [ "$status" = "200" ] && [ "$prerendered" = "true" ]; then
              echo "✅ rendered ($renders): $url"
            else
              echo "❌ failed (HTTP $status): $url"
              failed+=("$url")
            fi

            sleep "$RENDER_GAP"
          done

          echo ""
          echo "Rendered this run: $renders, failed: ${#failed[@]}"
          if [ ${#failed[@]} -gt 0 ]; then
            printf '  %s\n' "${failed[@]}"
            # Failed pages stay stale, so tomorrow's run retries them.
            # Only fail the job if everything failed (likely a real outage).
            [ "$renders" -gt "${#failed[@]}" ] || exit 1
          fi

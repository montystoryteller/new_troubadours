<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Event Flyers — New Troubadours</title>
    <link rel="icon" type="image/x-icon" href="favicon.png">
    <link rel="stylesheet" href="shared-styles.css">
    <link rel="stylesheet" href="flyers-styles.css">
</head>

<body>

    <nav class="site-nav" aria-label="Site navigation">
        <a href="index.html">🏠 Home</a>
        <a href="new_troubadours_event_guide.html">🗺️ Calendar</a>
        <a href="new_troubadours_tour_guide.html">🎭 Touring Shows</a>
        <a href="new_troubadours_storyclub.html">📖 Story Clubs</a>
        <a href="new_troubadours_performers.html">🎤 Performers</a>
        <a href="new_troubadours_venues.html">📍 Venues</a>
        <a href="new_troubadours_festival.html">🎪 Festivals</a>
        <a href="new_troubadours_flyers.html" aria-current="page">📋 Flyers</a>
        <a href="new_troubadours_media.html">🎥 Watch &amp; Listen</a>
        <a href="new_troubadours_stats.html">📊 Stats</a>
    </nav>

    <h1>The New Troubadours — Event Flyers</h1>
    <h2>Upcoming shows, tours and story nights</h2>

    <div id="date-override-banner" style="display:none;">
        🗓 <strong>Test mode:</strong> viewing flyers as if today were <strong id="date-override-label"></strong>
        — <a href="?">back to real today</a>
    </div>

    <div class="filter-bar" id="filterBar">
        <span class="filter-bar-label">Show:</span>
        <button class="filter-btn active" data-type="story" onclick="toggleFilter('story')">📖 Story shows</button>
        <button class="filter-btn active" data-type="club" onclick="toggleFilter('club')">🏠 Club regulars</button>
        <button class="filter-btn active" data-type="tour" onclick="toggleFilter('tour')">🎭 Tours</button>
        <button class="filter-btn active" data-type="music" onclick="toggleFilter('music')">🎵 Music</button>
        <button class="filter-btn active" data-type="poetry" onclick="toggleFilter('poetry')">✒️ Poetry</button>
        <button class="filter-btn active" data-type="festival" onclick="toggleFilter('festival')">🎪 Festivals</button>
        <div class="filter-divider"></div>
        <button class="filter-btn filter-btn-compact" onclick="selectAll()">All</button>
        <button class="filter-btn filter-btn-compact" onclick="selectNone()">None</button>
    </div>

    <div class="filter-bar" id="statusFilterBar">
        <div class="filter-check-row">
            <label><input type="checkbox" id="hideCancelled" checked onchange="renderAll()"> &#10060; Hide
                cancelled</label>
            <label><input type="checkbox" id="highlightSoldOut" checked onchange="renderAll()"> &#128308; Highlight sold
                out</label>
        </div>
    </div>

    <div class="filter-bar" id="tourFilterBar" style="display:none;">
        <div class="filter-tour-row">
            <label for="tourFilterSelect">🎭 Limit to tour:</label>
            <select id="tourFilterSelect" onchange="handleTourFilterChange()">
                <option value="">— All tours —</option>
            </select>
            <button class="tour-filter-clear" id="tourFilterClear" onclick="clearTourFilter()">✕ Clear</button>
        </div>
    </div>

    <details id="videoTrailersSection" class="video-trailers-section" style="display:none;">
        <summary class="section-heading video-trailers-summary">🎬 Video Trailers <span class="count"
                id="videoTrailersCount"></span></summary>
        <div id="videoTrailersBody" class="video-trailers-body"></div>
    </details>

    <div id="page-content">
        <p class="status-message status-message--loading">Loading…</p>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Flyer viewer">
        <button class="lb-nav" id="lb-prev" aria-label="Previous">&#8249;</button>
        <div id="lightbox-inner">
            <button id="lightbox-close" aria-label="Close">×</button>
            <img id="lightbox-img" src="" alt="">
            <div id="lightbox-caption"></div>
        </div>
        <button class="lb-nav" id="lb-next" aria-label="Next">&#8250;</button>
    </div>

    <!-- Context menu -->
    <div id="ctx-menu" role="menu" aria-label="Flyer options"></div>

    <script src="shared_utils.js"></script>
    <script src="flyers.js"></script>
</body>

</html>
